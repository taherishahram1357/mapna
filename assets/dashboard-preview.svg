<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">نمای تصویری داشبورد سیگنال رمز ارز</title>
  <desc id="desc">یک پیش‌نمایش تاریک از داشبورد فارسی با نمودار قیمت، میانگین‌های متحرک، باند بولینگر و کارت‌های ورود و خروج.</desc>
  <defs>
